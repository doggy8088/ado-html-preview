# 建立 GitHub Release，並（可選）上架到 Chrome Web Store
#
# 觸發條件：main 分支有新 commit 且 manifest.json 的 version 尚未發布過（以 git tag v<version> 是否存在判斷）。
# 流程：
#   1. check   讀版本、確認 release-notes/v<version>.md 存在，決定要不要上傳 CWS。
#   2. release 打包 zip → 建立 git tag → 以 release notes 檔建立 GitHub Release（附 zip）。
#   3. cws     下載 Release 上的 zip → 取得 OAuth access token → 上傳新版本 → 送審並發布。
#
# CWS 上傳開關（Repository variable，Settings → Secrets and variables → Actions → Variables）：
#   CWS_AUTO_PUBLISH   設為 true 才會在推到 main 時自動上傳 Chrome Web Store；未設定或其他值 = 只建立 GitHub Release。
#   手動執行（workflow_dispatch）時改由 cws_upload 參數決定，不看這個變數。
#
# 需要的 Repository secrets（只有上傳 CWS 時才用到）：
#   CWS_PUBLISHER_ID   Chrome Web Store 開發人員主控台「帳戶」頁的 Publisher ID
#   CWS_EXTENSION_ID   擴充功能 ID（32 個小寫字母）
#   CWS_CLIENT_ID      Google Cloud OAuth 用戶端 ID
#   CWS_CLIENT_SECRET  Google Cloud OAuth 用戶端密鑰
#   CWS_REFRESH_TOKEN  以 OAuth Playground 取得的 refresh token（scope: https://www.googleapis.com/auth/chromewebstore）
# 詳細設定步驟見 docs/PUBLISHING.md。

name: Release and Publish to Chrome Web Store

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cws_upload:
        description: "上傳到 Chrome Web Store（若此版本的 Release 已存在，會上傳該 Release 的 zip）"
        type: boolean
        default: false
      publish:
        description: "上傳後是否立刻送審發布（false = 只上傳成草稿）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

jobs:
  check:
    name: 檢查版本與 Release Notes
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
      cws: ${{ steps.ver.outputs.cws }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: ver
        name: 讀取 manifest 版本並比對 tag
        env:
          EVENT: ${{ github.event_name }}
          CWS_AUTO_PUBLISH: ${{ vars.CWS_AUTO_PUBLISH }}
          CWS_UPLOAD_INPUT: ${{ inputs.cws_upload }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version manifest.json)"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "manifest version 格式不正確: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION 已存在，這個版本已經發布過 Release。"
            RELEASE=false
          else
            NOTES="release-notes/v$VERSION.md"
            if [[ ! -f "$NOTES" ]] || ! grep -q '[^[:space:]]' "$NOTES"; then
              echo "::error file=$NOTES::新版本 $VERSION 缺少 Release Notes，請新增 $NOTES 並寫好這一版的變更內容。" >&2
              exit 1
            fi
            echo "新版本 $VERSION，準備建立 Release。"
            RELEASE=true
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

          CWS=false
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            [[ "$CWS_UPLOAD_INPUT" == "true" ]] && CWS=true
          elif [[ "$RELEASE" == "true" && "$CWS_AUTO_PUBLISH" == "true" ]]; then
            CWS=true
          fi
          if [[ "$RELEASE" == "true" && "$CWS" != "true" ]]; then
            echo "::notice::未啟用 Chrome Web Store 上傳（push 看 CWS_AUTO_PUBLISH 變數、手動執行看 cws_upload 參數），本次只建立 GitHub Release。"
          fi
          echo "cws=$CWS" >> "$GITHUB_OUTPUT"

  release:
    name: 打包並建立 GitHub Release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: 打包 zip
        run: ./scripts/package.sh

      - name: 建立 tag 與 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" "dist/ado-html-preview-${VERSION}.zip" \
            --title "v${VERSION}" \
            --notes-file "release-notes/v${VERSION}.md" \
            --generate-notes

  cws:
    name: 上傳並發布到 Chrome Web Store
    needs: [check, release]
    # release 被略過（手動執行且 Release 已存在）時仍要執行，但 release 失敗就不上傳
    if: ${{ !cancelled() && needs.check.outputs.cws == 'true' && needs.release.result != 'failure' }}
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: 下載 Release 上的 zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" -R "$GITHUB_REPOSITORY" \
            -p "ado-html-preview-${VERSION}.zip" -D dist

      - name: 取得 access token
        id: token
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for v in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            [[ -n "${!v}" ]] || { echo "缺少 secret: $v" >&2; exit 1; }
          done
          RESP="$(curl -sS "https://oauth2.googleapis.com/token" \
            -d "client_id=$CWS_CLIENT_ID" \
            -d "client_secret=$CWS_CLIENT_SECRET" \
            -d "refresh_token=$CWS_REFRESH_TOKEN" \
            -d "grant_type=refresh_token")"
          TOKEN="$(jq -r '.access_token // empty' <<<"$RESP")"
          [[ -n "$TOKEN" ]] || { echo "取得 access token 失敗: $(jq -c 'del(.access_token)' <<<"$RESP")" >&2; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: 上傳新版本
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CWS_PUBLISHER_ID" && -n "$CWS_EXTENSION_ID" ]] || { echo "缺少 CWS_PUBLISHER_ID 或 CWS_EXTENSION_ID" >&2; exit 1; }
          ZIP="dist/ado-html-preview-${VERSION}.zip"
          HTTP="$(curl -sS -o upload.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ZIP" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:upload")"
          echo "HTTP $HTTP"; cat upload.json; echo
          REASON="$(jq -r '[.error.details[]? | .reason? // empty] | first // ""' upload.json 2>/dev/null || true)"
          case "$REASON" in
            NOT_UPDATEABLE)
              echo "::error::Chrome Web Store 目前有版本正在審查中，審查期間不能上傳新版本。等審查完成後手動執行這個 workflow 並勾選 cws_upload 即可。" >&2; exit 1 ;;
          esac
          if [[ "$HTTP" != 2* ]]; then
            if grep -qi 'version' upload.json; then
              echo "::error::上傳被拒絕，請確認 manifest.json 的 version（$VERSION）比商店目前的版本高。" >&2
            fi
            echo "上傳失敗" >&2; exit 1
          fi
          # 回應若帶有錯誤狀態（例如版本號沒有增加）也視為失敗
          if jq -e '(.error // empty) or ((.itemError // []) | length > 0) or (.uploadState? == "FAILURE")' upload.json >/dev/null; then
            echo "上傳被 Chrome Web Store 拒絕" >&2; exit 1
          fi

      - name: 送審並發布
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o publish.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Length: 0" \
            "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:publish")"
          echo "HTTP $HTTP"; cat publish.json; echo
          [[ "$HTTP" == 2* ]] || { echo "送審發布失敗" >&2; exit 1; }
          if jq -e '.error // empty' publish.json >/dev/null; then
            echo "送審發布被拒絕" >&2; exit 1
          fi
